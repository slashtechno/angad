name: Build React Router App (Bun)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v3
        with:
          bun-version: latest

      - name: Show Bun version
        run: bun --version

      - name: Install dependencies (bun)
        run: bun install

      - name: Build (production) with bun
        env:
          NODE_ENV: production
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

      - name: List build output
        run: |
          echo "Contents of ./build"
          ls -la build || true
